name: 程序问题
description: 报告可以重复出现的页面、交互或多人模式问题
title: "[Bug] "
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已刷新页面并确认问题仍然存在
          required: true
        - label: 这不是题库数据错误或安全漏洞
          required: true
  - type: dropdown
    attributes:
      label: 玩法
      options:
        - 主页
        - 经典推理
        - 多人模式
        - 线索阶梯
        - 时光机
        - 其他
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 说明发生了什么，以及你原本预期看到什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 重现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    attributes:
      label: 浏览器和设备
      placeholder: 例如 Edge 140 / Windows 11，或微信内置浏览器 / Android
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 可以添加已遮挡昵称、房间码、IP 和凭据的截图。
