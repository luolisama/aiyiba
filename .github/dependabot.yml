version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      react-stack:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react"
          - "@types/react-dom"
      react-stack-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react"
          - "@types/react-dom"
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
          - "@next/eslint-plugin-next"
          - typescript-eslint
        update-types:
          - minor
          - patch
      development-patch-minor:
        dependency-type: development
        exclude-patterns:
          - typescript
          - vinext
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
